# Umami 反向代理示例（Nginx）
#
# 把 umami.example.com 换成你的子域名；证书路径按实际改（宝塔 / acme.sh / certbot 各不相同）。
# 部署后 Umami 后台地址是 https://umami.example.com，访问采集脚本是
# https://umami.example.com/script.js，分享链接是 https://umami.example.com/share/<shareId>。
#
# 注意：/stats/ 私密统计页是从浏览器直接请求这个域名的 API，所以它必须能从公网访问，
# 且必须是 HTTPS（https 页面请求 http 接口会被浏览器按混合内容拦截）。

server {
    listen 80;
    listen [::]:80;
    server_name umami.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name umami.example.com;

    # [改这里] TLS 证书
    ssl_certificate     /etc/letsencrypt/live/umami.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/umami.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Umami 请求体很小，收紧一点
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 预留 WebSocket 升级（Umami 当前不依赖，但代理层保留更稳）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
